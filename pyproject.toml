[project]
name = "universal-agent"
version = "0.1.0"
description = "Universal Local Agent using LangGraph"
authors = [{name = "LocalUser"}]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=0.2.0",
    "langgraph>=0.1.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.7.0",
    "langchain-core>=0.2.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
